name: Build & Release MCPB Bundle

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r packaging/requirements.txt

      - name: Run Pre-flight Health Doctor Check
        run: |
          python -m packaging.server.main --doctor

      - name: Build MCPB Bundle
        run: |
          python scripts/package_mcpb.py

      - name: Upload MCPB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: topospatial-cad-mcpb
          path: dist/*.mcpb

      - name: Release Assets to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/TopoSpatial-CAD-MCP-*.mcpb
            dist/TopoSpatial-CAD-MCP.mcpb
            packaging/server.json
          generate_release_notes: true
